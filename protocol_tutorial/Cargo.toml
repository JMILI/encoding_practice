[package]
name = "protocol_tutorial"
version = "0.1.0"
edition = "2021"
description = "UDP 协议编解码交互式 Web 教程"

[lib]
path = "src/lib.rs"

[[bin]]
name = "web"
path = "src/bin/web.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
